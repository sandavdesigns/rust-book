name: Build isolated RustDesk test client

on:
  push:
    paths:
      - '.github/workflows/build-test-client.yml'
      - 'experimental/secure-tcp-v1/prepare-test-client.py'
      - 'experimental/secure-tcp-v1/client-1.5.1-strict.patch'
      - 'BUILD-CLIENT.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-bridge:
    name: Generate Flutter bridge
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out this repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          persist-credentials: false

      - name: Check out pinned public RustDesk source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          repository: rustdesk/rustdesk
          ref: 23e5bb471a040d62f0a6ad52591fb30784265b73
          path: client
          submodules: recursive
          persist-credentials: false

      - name: Install bridge prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake gcc g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config

      - name: Install Rust 1.75 for bridge generation
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1.85.0
        with:
          toolchain: '1.75'
          targets: x86_64-unknown-linux-gnu

      - name: Cache bridge Rust build data
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.7.8
        with:
          workspaces: client
          prefix-key: rustdesk-1-5-1-bridge

      - name: Install Flutter 3.22.3 for bridge generation
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.21.0
        with:
          channel: stable
          flutter-version: '3.22.3'
          cache: true

      - name: Generate bridge artifacts as upstream does
        working-directory: client
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          (cd flutter && flutter pub get)
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload generated bridge
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: rustdesk-1-5-1-bridge
          if-no-files-found: error
          path: |
            client/src/bridge_generated.rs
            client/src/bridge_generated.io.rs
            client/flutter/lib/generated_bridge.dart
            client/flutter/lib/generated_bridge.freezed.dart
            client/flutter/macos/Runner/bridge_generated.h
            client/flutter/ios/Runner/bridge_generated.h

  build-macos-arm64:
    name: Build macOS arm64 test app
    needs: generate-bridge
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Check out this repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          persist-credentials: false

      - name: Check out pinned public RustDesk source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          repository: rustdesk/rustdesk
          ref: 23e5bb471a040d62f0a6ad52591fb30784265b73
          path: client
          submodules: recursive
          persist-credentials: false

      - name: Verify and apply the strict client patch and isolation changes
        run: |
          python3 experimental/secure-tcp-v1/prepare-test-client.py \
            --source client \
            --strict-patch experimental/secure-tcp-v1/client-1.5.1-strict.patch

      - name: Restore generated bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4.3.0
        with:
          name: rustdesk-1-5-1-bridge
          path: client

      - name: Install build runtime matching upstream macOS CI
        run: |
          brew install llvm create-dmg pkg-config
          curl --fail --location --output /tmp/nasm.zip https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip -q /tmp/nasm.zip -d /tmp
          sudo cp /tmp/nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install Flutter 3.24.5 and apply upstream workaround
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.21.0
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Patch Flutter SDK as pinned upstream workflow does
        working-directory: client
        shell: bash
        run: |
          flutter_root="$(dirname "$(dirname "$(command -v flutter)")")"
          git -C "$flutter_root" apply "$GITHUB_WORKSPACE/client/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' "$flutter_root/packages/flutter/lib/src/scheduler/binding.dart"

      - name: Install Rust 1.81 for macOS arm64
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1.85.0
        with:
          toolchain: '1.81'
          targets: aarch64-apple-darwin
          components: rustfmt

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.7.8
        with:
          workspaces: client
          prefix-key: rustdesk-1-5-1-macos-arm64

      - name: Set up pinned vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.5.0
        with:
          vcpkgGitCommitId: 9e593bb18ea69cc5095e012465dcd675a822ed0d
          vcpkgJsonGlob: client/vcpkg.json
          doNotCache: false

      - name: Install vcpkg manifest dependencies
        working-directory: client
        run: |
          "$VCPKG_ROOT/vcpkg" install --x-install-root="$VCPKG_ROOT/installed"

      - name: Build unsigned isolated macOS arm64 app
        working-directory: client
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.3'
        run: |
          sed -i -e 's/MACOSX_DEPLOYMENT_TARGET\=[0-9]*\.[0-9]*/MACOSX_DEPLOYMENT_TARGET=12.3/' build.py
          sed -i -e "s/platform :osx, '.*'/platform :osx, '12.3'/" flutter/macos/Podfile
          sed -i -e 's/osx_minimum_system_version = "[0-9]*\.[0-9]*"/osx_minimum_system_version = "12.3"/' Cargo.toml
          sed -i -e 's/MACOSX_DEPLOYMENT_TARGET = [0-9]*\.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = 12.3;/' flutter/macos/Runner.xcodeproj/project.pbxproj
          ./build.py --flutter --hwcodec --unix-file-copy-paste --screencapturekit
          test -d flutter/build/macos/Build/Products/Release/RustDeskLab.app

      - name: Package unsigned app bundle without dereferencing links
        working-directory: client/flutter/build/macos/Build/Products/Release
        run: tar -czf "$GITHUB_WORKSPACE/RustDeskLab-macos-arm64.tar.gz" RustDeskLab.app

      - name: Upload isolated unsigned macOS app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: RustDeskLab-macos-arm64
          if-no-files-found: error
          path: RustDeskLab-macos-arm64.tar.gz

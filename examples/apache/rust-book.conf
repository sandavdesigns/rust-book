# Example Apache TLS VirtualHost. Replace all paths and the hostname.
# Enable mod_ssl and PHP, and route all application requests to public/index.php.
# The port-80 host intentionally serves no API or login form.
<VirtualHost *:80>
    ServerName rust-book.example.com
    <Location />
        Require all denied
    </Location>
</VirtualHost>

<VirtualHost *:443>
    ServerName rust-book.example.com
    DocumentRoot "/var/www/rust-book/public"
    SSLEngine on
    SSLCertificateFile "/etc/letsencrypt/live/rust-book.example.com/fullchain.pem"
    SSLCertificateKeyFile "/etc/letsencrypt/live/rust-book.example.com/privkey.pem"
    LimitRequestBody 1048576
    <Directory "/var/www/rust-book">
        Require all denied
    </Directory>
    <Directory "/var/www/rust-book/public">
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
    SetEnvIf Authorization "(.+)" HTTP_AUTHORIZATION=$1
</VirtualHost>
# Never point DocumentRoot at the repository root.
